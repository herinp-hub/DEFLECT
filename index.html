<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b17"><title>DEFLECT — Rift Arena</title></head><body style="margin:0;background:#070b17;color:#eaf7ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><div id="loading">Loading DEFLECT…</div><script>
(async()=>{try{let encoded='';for(let i=0;i<25;i++){const n=String(i).padStart(3,'0');const r=await fetch('/game/chunks/'+n+'.txt');if(!r.ok)throw new Error('Missing game chunk '+n);encoded+=(await r.text()).trim()}const raw=atob(encoded);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='DEFLECT could not load. Please refresh.';console.error(e)}})();
</script></body></html>
