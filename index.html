/* Rotate only the sky-lobby scene objects 90 degrees counterclockwise. */
(function rotateSkyLobbyLeft(){
  const lobbyCenter=new THREE.Vector3(29.5,0,0);
  const lobbyRoots=scene.children.filter(object=>{
    if(object===player||object===orb||object===camera)return false;
    const bounds=new THREE.Box3().setFromObject(object);
    /* Some portal markers and trigger groups have no renderable geometry, so
       Box3 is empty even though their world positions still drive interaction. */
    const center=bounds.isEmpty()
      ? object.getWorldPosition(new THREE.Vector3())
      : bounds.getCenter(new THREE.Vector3());
    return Math.hypot(center.x-lobbyCenter.x,center.z-lobbyCenter.z)<27;
  });
  /* Rotate each lobby root in world space without reparenting it. This keeps
     proximity checks and world-position references aligned with the scene. */
  lobbyRoots.forEach(object=>{
    const offset=object.position.clone().sub(lobbyCenter);
    object.position.set(lobbyCenter.x+offset.z,offset.y,lobbyCenter.z-offset.x);
    object.rotation.y+=Math.PI/2;
  });
})();

  .map(hit=>({hit,normal:hit.face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld)).normalize()}))
  .filter(item=>item.normal.y>0.62)
  .sort((a,b)=>a.hit.point.y-b.hit.point.y)[0]||{}).hit;

  ?(Array.isArray(floorHit.object.material)?floorHit.object.material[floorHit.face.materialIndex||0]:floorHit.object.material)
  :null;

 );

(function pinTrainingPromptToPortal(){

  if(!prompt.isConnected)return;

  prompt.style.visibility=visible?"visible":"hidden";

 };
 requestAnimationFrame(update);
