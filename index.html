<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b17"><title>DEFLECT — Rift Arena</title></head><body style="margin:0;background:#070b17;color:#eaf7ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><div id="loading">Loading DEFLECT…</div><script>
(async()=>{try{let encoded='';for(let i=0;i<25;i++){const n=String(i).padStart(3,'0');const r=await fetch('/game/chunks/'+n+'.txt');if(!r.ok)throw new Error('Missing game chunk '+n);encoded+=(await r.text()).trim()}const raw=atob(encoded);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();
const gameplayPatches=[
  ["position:target.getWorldPosition(new THREE.Vector3())","position:core.getWorldPosition(new THREE.Vector3())"],
  ["orb.position.distanceTo(target)<1.0","orb.position.distanceTo(target)<1.3"],
  ["if(trainingMode){trainingMisses++;const st=document.getElementById('trainingStats');if(st)st.textContent='Successful deflects: '+trainingHits+' • Misses: '+trainingMisses;document.getElementById(\"statusHud\").textContent=\"MISSED — TRY AGAIN\";orb.userData.vel=null;targetId=-2;ballTimer=0.8;playerAttemptUsed=true;}","if(trainingMode){trainingMisses++;const st=document.getElementById('trainingStats');if(st)st.textContent='Successful deflects: '+trainingHits+' • Misses: '+trainingMisses;trainingMode=false;const h=document.getElementById('islandHud');if(h){h.querySelector('#trainingPanel').style.display='none';h.querySelector('#trainingToggle').textContent='TRAIN';}eliminate(-1);}"]
];
for(const [before,after] of gameplayPatches){if(!html.includes(before))throw new Error('Gameplay patch target missing: '+before.slice(0,70));html=html.replace(before,after);}
document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='DEFLECT could not load. Please refresh.';console.error(e)}})();
</script></body></html>
